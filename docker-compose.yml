services:
  postgres:
    image: postgres:16-alpine
    container_name: worklog-postgres
    environment:
      POSTGRES_DB: worklog
      POSTGRES_USER: worklog
      POSTGRES_PASSWORD: worklog
      TZ: Asia/Seoul
    ports:
      # 기본값은 PRD 8. 의 5432. 로컬에 PostgreSQL 이 이미 5432 를 쓰고 있으면
      # 루트 .env 에 POSTGRES_PORT=5433 처럼 적어 덮어쓴다. 컨테이너 안에서는 그대로 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - worklog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklog -d worklog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  worklog-pgdata:
